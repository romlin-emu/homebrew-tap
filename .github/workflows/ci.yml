name: Cask validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register checked-out tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/romlin-emu/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          test ! -e "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
      - name: Check cask style
        run: brew style --cask romlin-emu/tap/romlin
      - name: Audit cask
        run: brew audit --cask romlin-emu/tap/romlin
